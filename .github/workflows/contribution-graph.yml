name: Update contribution graph

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution line chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node << 'EOF'
          const fs = require('fs'), https = require('https');
          const USER = 'dinalegw';

          function fetchGraphQL(token) {
            const q = JSON.stringify({
              query: `query($u:String!,$f:DateTime!,$t:DateTime!){user(login:$u){contributionsCollection(from:$f,to:$t){contributionCalendar{totalContributions weeks{contributionDays{contributionCount date}}}}}}`,
              variables: { u: USER, f: new Date(Date.now()-31536000000).toISOString(), t: new Date().toISOString() }
            });
            return new Promise((res,rej)=>{
              const r=https.request({hostname:'api.github.com',path:'/graphql',method:'POST',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json','User-Agent':'cg'}},resp=>{let d='';resp.on('data',c=>d+=c);resp.on('end',()=>{try{res(JSON.parse(d))}catch(e){rej(e)}})});
              r.on('error',rej);r.write(q);r.end();
            });
          }

          (async()=>{
            const data = await fetchGraphQL(process.env.GITHUB_TOKEN);
            if (!data.data) throw new Error(JSON.stringify(data.errors));
            const cal = data.data.user.contributionsCollection.contributionCalendar;
            const weeks = cal.weeks;

            const days = [];
            let maxCount = 0;
            for (const week of weeks) {
              for (const day of week.contributionDays) {
                const c = day.contributionCount;
                days.push({ date: new Date(day.date), count: c });
                if (c > maxCount) maxCount = c;
              }
            }
            days.sort((a,b) => a.date - b.date);

            const total = cal.totalContributions;

            // 7-day moving average
            const smoothed = days.map((_,i)=>{
              let s=0,n=0;
              for(let j=Math.max(0,i-3);j<Math.min(days.length,i+4);j++){s+=days[j].count;n++;}
              return s/n;
            });
            const smoothMax = Math.max(...smoothed,1);

            const W=820,H=280,pad={top:38,right:30,bottom:42,left:58};
            const cw=W-pad.left-pad.right,ch=H-pad.top-pad.bottom;
            const yMax=Math.ceil(Math.max(maxCount,smoothMax)/5)*5||5;

            const yTicks=[];
            for(let i=0;i<=4;i++) yTicks.push(Math.round((yMax/4)*i));

            const months=[];
            for(let i=0;i<days.length;i++){
              const d=days[i].date;
              if(d.getDate()===1||i===0){
                const m=d.toLocaleString('en',{month:'short'});
                if(!months.length||months[months.length-1].label!==m) months.push({idx:i,label:m});
              }
            }

            const weekLines=[];
            for(let i=0;i<days.length;i+=28) weekLines.push(i);

            let areaPath='',smoothPath='';
            for(let i=0;i<days.length;i++){
              const x=(i/(days.length-1))*cw;
              const sy=ch-(smoothed[i]/yMax)*ch;
              if(i===0){smoothPath+=`M${x} ${sy}`;areaPath+=`M${x} ${ch}L${x} ${sy}`;}
              else{smoothPath+=` L${x} ${sy}`;areaPath+=` L${x} ${sy}`;}
            }
            areaPath+=` L${cw} ${ch}Z`;

            // Peak days (top 3)
            const sorted=[...days].sort((a,b)=>b.count-a.count);
            const peaks=sorted.slice(0,3).filter(d=>d.count>0);
            const activeDays=days.filter(d=>d.count>0).length;
            const avgPerActive=Math.round(total/(activeDays||1));
            let curStreak=0,longestStreak=0;
            for(const d of days){
              if(d.count>0){curStreak++;if(curStreak>longestStreak)longestStreak=curStreak;}
              else curStreak=0;
            }

            const font='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif';
            let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}">
            <defs>
              <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#39d353" stop-opacity=".25"/><stop offset="100%" stop-color="#39d353" stop-opacity=".02"/></linearGradient>
              <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#26a641"/><stop offset="30%" stop-color="#39d353"/><stop offset="100%" stop-color="#39d353"/></linearGradient>
              <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            </defs>
            <rect width="${W}" height="${H}" fill="#0d1117" rx="10"/>
            <g transform="translate(${pad.left},14)">
              <text x="0" y="0" fill="#e6edf3" font-size="20" font-family="${font}" font-weight="700">${total.toLocaleString()}</text>
              <text x="0" y="18" fill="#8b949e" font-size="11" font-family="${font}">contributions in the last year</text>
            </g>
            <g transform="translate(${pad.left},${pad.top})">
              ${weekLines.map(i=>`<line x1="${(i/(days.length-1))*cw}" y1="0" x2="${(i/(days.length-1))*cw}" y2="${ch}" stroke="#161b22" stroke-width="1"/>`).join('')}
              ${yTicks.map(t=>{const y=ch-(t/yMax)*ch;return `<line x1="0" y1="${y}" x2="${cw}" y2="${y}" stroke="#21262d" stroke-width="1"/><text x="-10" y="${y+4}" fill="#8b949e" font-size="10" text-anchor="end" font-family="${font}">${t}</text>`;}).join('')}
              <line x1="0" y1="${ch}" x2="${cw}" y2="${ch}" stroke="#30363d" stroke-width="1"/>
              ${months.map(m=>`<text x="${(m.idx/(days.length-1))*cw}" y="${ch+18}" fill="#8b949e" font-size="10" text-anchor="middle" font-family="${font}">${m.label}</text>`).join('')}
              <path d="${areaPath}" fill="url(#ag)"/>
              <path d="${smoothPath}" fill="none" stroke="url(#lg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
              ${peaks.map(d=>{const i=days.indexOf(d);const x=(i/(days.length-1))*cw;const y=ch-(d.count/yMax)*ch;return `<circle cx="${x}" cy="${y}" r="4" fill="#39d353" stroke="#0d1117" stroke-width="2"/><text x="${x}" y="${y-10}" fill="#39d353" font-size="9" text-anchor="middle" font-family="${font}" font-weight="600">${d.count}</text>`;}).join('')}
            </g>
            <g transform="translate(${pad.left},${H-12})">
              <rect x="0" y="-8" width="${cw}" height="1" fill="#21262d" opacity=".5"/>
              <text x="0" y="6" fill="#8b949e" font-size="11" font-family="${font}"><tspan fill="#e6edf3" font-weight="600">${activeDays}</tspan> active days</text>
              <text x="${cw*0.33}" y="6" fill="#8b949e" font-size="11" font-family="${font}"><tspan fill="#e6edf3" font-weight="600">${avgPerActive}</tspan> avg per active day</text>
              <text x="${cw*0.66}" y="6" fill="#8b949e" font-size="11" font-family="${font}"><tspan fill="#e6edf3" font-weight="600">${longestStreak}d</tspan> longest streak</text>
            </g>
            </svg>`;

            fs.writeFileSync('profile/contribution-graph.svg', svg);
            console.log('Line chart generated');
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF

      - name: Commit contribution graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/contribution-graph.svg
          git commit -m "Update contribution graph [skip ci]" || exit 0
          git push
