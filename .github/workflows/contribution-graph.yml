name: Update contribution graph

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution line chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node << 'EOF'
          const fs = require('fs'), https = require('https');
          const USER = 'dinalegw';

          function fetchGraphQL(token) {
            const q = JSON.stringify({
              query: `query($u:String!,$f:DateTime!,$t:DateTime!){user(login:$u){contributionsCollection(from:$f,to:$t){contributionCalendar{totalContributions weeks{contributionDays{contributionCount date}}}}}}`,
              variables: { u: USER, f: new Date(Date.now()-31536000000).toISOString(), t: new Date().toISOString() }
            });
            return new Promise((res,rej)=>{
              const r=https.request({hostname:'api.github.com',path:'/graphql',method:'POST',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json','User-Agent':'cg'}},resp=>{let d='';resp.on('data',c=>d+=c);resp.on('end',()=>{try{res(JSON.parse(d))}catch(e){rej(e)}})});
              r.on('error',rej);r.write(q);r.end();
            });
          }

          (async()=>{
            const data = await fetchGraphQL(process.env.GITHUB_TOKEN);
            if (!data.data) throw new Error(JSON.stringify(data.errors));
            const cal = data.data.user.contributionsCollection.contributionCalendar;
            const weeks = cal.weeks;

            // Flatten weeks into daily array
            const days = [];
            let maxCount = 0;
            for (const week of weeks) {
              for (const day of week.contributionDays) {
                const c = day.contributionCount;
                days.push({ date: new Date(day.date), count: c });
                if (c > maxCount) maxCount = c;
              }
            }
            days.sort((a,b) => a.date - b.date);

            const total = cal.totalContributions;
            const W = 760, H = 240;
            const pad = { top: 30, right: 20, bottom: 35, left: 50 };
            const cw = W - pad.left - pad.right, ch = H - pad.top - pad.bottom;
            const yMax = Math.max(maxCount, 5);

            // Y-axis ticks
            const yTicks = [];
            const step = Math.ceil(yMax / 4);
            for (let i = 0; i <= 4; i++) yTicks.push(step * i);

            // Month labels
            const months = [];
            for (let i = 0; i < days.length; i++) {
              const d = days[i].date;
              if (d.getDate() === 1 || i === 0) {
                const m = d.toLocaleString('en', { month: 'short' });
                if (!months.length || months[months.length-1].label !== m) months.push({ idx: i, label: m });
              }
            }

            // Build paths
            let linePath = '', areaPath = '';
            for (let i = 0; i < days.length; i++) {
              const x = (i / (days.length - 1)) * cw;
              const y = ch - (days[i].count / yMax) * ch;
              if (i === 0) { linePath += `M${x} ${y}`; areaPath += `M${x} ${ch}L${x} ${y}`; }
              else { linePath += ` L${x} ${y}`; areaPath += ` L${x} ${y}`; }
            }
            areaPath += ` L${cw} ${ch}Z`;

            let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}">
            <defs>
              <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#39d353" stop-opacity=".35"/><stop offset="100%" stop-color="#39d353" stop-opacity=".02"/></linearGradient>
              <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#26a641"/><stop offset="50%" stop-color="#39d353"/><stop offset="100%" stop-color="#39d353"/></linearGradient>
            </defs>
            <rect width="${W}" height="${H}" fill="#0d1117" rx="8"/>
            <g transform="translate(${pad.left},${pad.top})">
              <text x="0" y="-8" fill="#8b949e" font-size="13" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600">${total.toLocaleString()} Contributions in the Last Year</text>`;

            for (const t of yTicks) {
              const y = ch - (t / yMax) * ch;
              svg += `<line x1="0" y1="${y}" x2="${cw}" y2="${y}" stroke="#21262d" stroke-width="1"/><text x="-8" y="${y+4}" fill="#8b949e" font-size="10" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">${t}</text>`;
            }
            for (const m of months) {
              const x = (m.idx / (days.length-1)) * cw;
              svg += `<text x="${x}" y="${ch+16}" fill="#8b949e" font-size="10" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">${m.label}</text>`;
            }
            svg += `<path d="${areaPath}" fill="url(#ag)"/><path d="${linePath}" fill="none" stroke="url(#lg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;

            for (let i = 0; i < days.length; i++) {
              if (days[i].count > 0) {
                const x = (i / (days.length-1)) * cw, y = ch - (days[i].count / yMax) * ch;
                svg += `<circle cx="${x}" cy="${y}" r="2.5" fill="#39d353" opacity=".8"/>`;
              }
            }
            svg += `</g></svg>`;

            fs.writeFileSync('profile/contribution-graph.svg', svg);
            console.log('Line chart generated');
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF

      - name: Commit contribution graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/contribution-graph.svg
          git commit -m "Update contribution graph [skip ci]" || exit 0
          git push
